[package]
name = "pyonji"
version = "0.2.0"
edition = "2024"

[features]
install = []

[dependencies]
anyhow = "1.0"
async-channel = "2.5.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
cansi = "2.2.1"
etagere = "0.3.0"
swash = "0.2.10"
portable-pty = "0.9.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
vt100 = "0.16.2"
wgpu = "29.0.3"
unicode-segmentation = "1.12"
ahash = "0.8.12"
fontdb = "0.24.0"
image = "0.25.10"
clap = { version = "4.6.0", features = ["derive"] }
dirs = "6.0.0"
mlua = { version = "0.12.1", features = ["anyhow", "lua55", "macros", "mlua_derive", "async", "userdata-wrappers", "vendored"] }
serde = { version = "1.0.228", features = ["derive"] }
notify = "8.2.0"
derive_more = { version = "2.1.1", features = ["deref", "deref_mut"] }
git-version = "0.3.9"
const_format = "0.2.36"
nucleo-matcher = "0.3.1"
unicode-width = "0.2.2"
self_update = { git = "https://github.com/jaemk/self_update", features = ["async"], rev = "63cbf45751b440cbfe008d80ee9ed0f1b4f56112" }
reqwest = { version = "0.13.4", features = ["json"] }
smol = "2.0.2"
futures = "0.3.32"
futures-util = "0.3.32"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.16"
async-compat = "0.2.5"
serde_json = "1.0.150"
tempfile = "3.27.0"
self-replace = "1.5.0"
ssh2 = "0.9.6"
mio = { version = "1.2.2", features = ["net", "os-poll"] }
smallvec = "1.16.1"
path-absolutize = "4.0.1"
lsp-types = { version = "0.97.0", features = ["proposed"] }
gpui = { git = "https://github.com/gpui-ce/gpui-ce", features = ["custom-gpu"], package = "gpui-ce" }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", package = "gpui_ce_platform" }
gpui_tokio = { git = "https://github.com/gpui-ce/gpui-ce", package = "gpui_ce_tokio" }
gpui_wgpu = { git = "https://github.com/gpui-ce/gpui-ce", package = "gpui_ce_wgpu" }
gpui_ce_components = { path = "../oss/gpui-component/crates/ui/", features = ["inspector"] }
gpui_ce_components_base = { path = "../oss/gpui-component/crates/base/", features = ["inspector"] }
gpui_ce_components_assets = { path = "../oss/gpui-component/crates/assets/" }
gpui_ce_components_macros = { path = "../oss/gpui-component/crates/macros/" }
rust-embed = "8.11.0"

[dev-dependencies]
gpui = { git = "https://github.com/gpui-ce/gpui-ce", features = ["test-support"], package = "gpui-ce" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.30"

# Local patch for the gpui-ce MSAA validation crash (see
# `vendor/gpui-ce/README.md`): redirects every package from the gpui-ce git
# source at this directory, so the whole graph — including the crates pulled
# in via the `../oss/gpui-component` path deps — builds against the patched
# copy with identical versions. Drop this table once the git source is
# bumped past upstream fix 8e36ac0 *and* `../oss/gpui-component` supports
# the new API.
[patch."https://github.com/gpui-ce/gpui-ce"]
gpui-ce = { path = "vendor/gpui-ce/crates/gpui" }
gpui_ce_apple = { path = "vendor/gpui-ce/crates/gpui_apple" }
gpui_ce_collections = { path = "vendor/gpui-ce/crates/gpui_collections" }
gpui_ce_derive_refineable = { path = "vendor/gpui-ce/crates/gpui_derive_refineable" }
gpui_ce_linux = { path = "vendor/gpui-ce/crates/gpui_linux" }
gpui_ce_macos = { path = "vendor/gpui-ce/crates/gpui_macos" }
gpui_ce_macros = { path = "vendor/gpui-ce/crates/gpui_macros" }
gpui_ce_media = { path = "vendor/gpui-ce/crates/gpui_media" }
gpui_ce_platform = { path = "vendor/gpui-ce/crates/gpui_platform" }
gpui_ce_refineable = { path = "vendor/gpui-ce/crates/gpui_refineable" }
gpui_ce_render = { path = "vendor/gpui-ce/crates/gpui_render" }
gpui_ce_scheduler = { path = "vendor/gpui-ce/crates/gpui_scheduler" }
gpui_ce_shared_string = { path = "vendor/gpui-ce/crates/gpui_shared_string" }
gpui_ce_sum_tree = { path = "vendor/gpui-ce/crates/gpui_sum_tree" }
gpui_ce_tokio = { path = "vendor/gpui-ce/crates/gpui_tokio" }
gpui_ce_util = { path = "vendor/gpui-ce/crates/gpui_ce_util" }
gpui_ce_web = { path = "vendor/gpui-ce/crates/gpui_web" }
gpui_ce_wgpu = { path = "vendor/gpui-ce/crates/gpui_wgpu" }
gpui_ce_windows = { path = "vendor/gpui-ce/crates/gpui_windows" }
